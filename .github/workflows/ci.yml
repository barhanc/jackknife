name: Game CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies with CPU-only PyTorch
        shell: bash
        run: |
          uv export --frozen --no-hashes --no-emit-project --prune torch --output-file "$RUNNER_TEMP/ci-requirements.txt"
          uv export --frozen --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/ci-constraints.txt"
          uv venv --python 3.12
          uv pip install --requirements "$RUNNER_TEMP/ci-requirements.txt" --constraint "$RUNNER_TEMP/ci-constraints.txt" --torch-backend cpu torch
      - name: Type check
        run: uv run --no-sync pyright
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export browser weights and Python reference cases
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync python web/tools/export_web_model.py
      - name: Test and build browser game
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
      - name: Upload GitHub Pages site
        if: >-
          matrix.os == 'ubuntu-latest' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish browser game
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
